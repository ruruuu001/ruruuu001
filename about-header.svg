<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.35" stop-color="#c8a2ff"/>
      <stop offset="0.6" stop-color="#7b2cbf"/>
      <stop offset="0.8" stop-color="#b98cf0"/>
      <stop offset="1" stop-color="#4a1a7a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="0.5" stop-color="#2a1048"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.5" stop-color="#9d4edd"/>
      <stop offset="1" stop-color="#3c096c"/>
    </linearGradient>
    <clipPath id="textclip">
      <text x="400" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" letter-spacing="8">ABOUT ME</text>
    </clipPath>
  </defs>

  <rect width="800" height="140" rx="18" fill="url(#bg)"/>
  <rect x="3" y="3" width="794" height="134" rx="16" fill="none" stroke="url(#metal)" stroke-width="2"/>

  <!-- metallic title -->
  <text x="400" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" letter-spacing="8" fill="url(#metal)">ABOUT ME</text>

  <!-- moving shine across the title -->
  <g clip-path="url(#textclip)">
    <rect x="-200" y="20" width="120" height="100" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" from="-200" to="900" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- left gems -->
  <g>
    <polygon points="60,70 76,50 92,70 76,90" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="110,100 120,88 130,100 120,112" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="120,32 128,22 136,32 128,42" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="2.8s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- right gems -->
  <g>
    <polygon points="708,70 724,50 740,70 724,90" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="670,100 680,88 690,100 680,112" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="664,32 672,22 680,32 672,42" fill="url(#gem)" stroke="#e9d5ff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0;-6,0;0,0" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- twinkling stars -->
  <g fill="#e9d5ff">
    <circle cx="200" cy="30" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="115" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="28" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="116" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- metallic line below -->
  <rect x="250" y="108" width="300" height="3" rx="1.5" fill="url(#metal)"/>
</svg>
